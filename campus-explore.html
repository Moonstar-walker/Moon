<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>校园探索冒险 · AI+X 黑客松</title>
<style>
  /* ===== 全局：深绿 + 紫色赛博校园风 ===== */
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: "Microsoft YaHei", "PingFang SC", sans-serif;
    background: radial-gradient(circle at 20% 10%, #123f31 0%, #0a2b21 50%, #1a1033 100%);
    min-height: 100vh;
    color: #e8f0ea;
    display: flex;
    justify-content: center;
    padding: 16px;
    overflow-x: hidden;
  }
  #app { width: 100%; max-width: 860px; }

  /* ===== 顶部 HUD ===== */
  #hud {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 16px;
    background: rgba(10,43,33,0.9);
    border: 1px solid #7c3aed55;
    border-radius: 12px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  #hud .title { font-weight: bold; color: #c4b5fd; letter-spacing: 2px; font-size: 16px; }
  .hp-wrap { flex: 1; min-width: 140px; }
  .hp-label { font-size: 12px; color: #9fb8ac; margin-bottom: 3px; }
  .hp-track { height: 10px; background: rgba(255,255,255,0.08); border-radius: 999px; overflow: hidden; }
  .hp-bar {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, #34d399, #10b981);
    border-radius: 999px;
    transition: width 0.35s ease, background 0.35s;
  }
  .hp-bar.low { background: linear-gradient(90deg, #f87171, #dc2626); }
  .hp-bar.mid { background: linear-gradient(90deg, #fbbf24, #f59e0b); }
  #hud .score-box { font-weight: bold; color: #ffd97d; font-size: 16px; white-space: nowrap; }
  #hud .levels { font-size: 13px; color: #a78bfa; letter-spacing: 4px; white-space: nowrap; }

  /* ===== 地图画布 ===== */
  #stage {
    position: relative;
    border: 1px solid #7c3aed66;
    border-radius: 14px;
    overflow: hidden;
    box-shadow: 0 10px 36px rgba(0,0,0,0.5);
    background: #0a2b21;
  }
  #map { display: block; width: 100%; height: auto; touch-action: none; }
  /* 进入关卡按钮（靠近建筑时出现） */
  #enterBtn {
    position: absolute;
    left: 50%; bottom: 14px;
    transform: translateX(-50%);
    background: linear-gradient(90deg, #7c3aed, #a78bfa);
    color: #fff;
    border: none;
    padding: 10px 22px;
    font-size: 15px;
    font-weight: bold;
    border-radius: 999px;
    cursor: pointer;
    box-shadow: 0 4px 16px #7c3aed88;
    animation: floaty 1.6s ease-in-out infinite;
    display: none;
  }
  @keyframes floaty { 50% { transform: translateX(-50%) translateY(-5px); } }

  /* ===== 移动端方向键 ===== */
  #dpad { display: none; margin-top: 12px; justify-content: center; }
  #dpad .pad {
    display: grid;
    grid-template-columns: repeat(3, 62px);
    grid-template-rows: repeat(3, 62px);
    gap: 6px;
  }
  .dkey {
    background: rgba(124,58,237,0.25);
    border: 1px solid #7c3aed88;
    color: #c4b5fd;
    font-size: 20px;
    border-radius: 12px;
    display: flex; align-items: center; justify-content: center;
    user-select: none;
  }
  .dkey:active, .dkey.on { background: #7c3aed; color: #fff; }
  .dkey.up { grid-area: 1 / 2; }
  .dkey.left { grid-area: 2 / 1; }
  .dkey.right { grid-area: 2 / 3; }
  .dkey.down { grid-area: 3 / 2; }

  /* ===== 通用弹窗层 ===== */
  .overlay {
    position: fixed; inset: 0;
    background: rgba(5,20,15,0.78);
    display: none;
    justify-content: center; align-items: center;
    z-index: 50;
    padding: 16px;
  }
  .overlay.show { display: flex; animation: fadeIn 0.25s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  .panel {
    width: 100%;
    max-width: 560px;
    max-height: 88vh;
    overflow-y: auto;
    background: linear-gradient(160deg, #0e3528 0%, #14523f 55%, #241543 100%);
    border: 1px solid #a78bfa66;
    border-radius: 16px;
    padding: 26px 24px;
    box-shadow: 0 14px 50px rgba(0,0,0,0.6);
    animation: zoomIn 0.25s ease;
  }
  @keyframes zoomIn { from { transform: scale(0.92); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .panel h2 { color: #c4b5fd; letter-spacing: 3px; margin-bottom: 14px; font-size: 20px; }
  .panel .desc { font-size: 15px; line-height: 1.9; color: #d7e5dd; white-space: pre-line; margin-bottom: 18px; }
  .opt {
    display: block;
    width: 100%;
    text-align: left;
    background: rgba(20,82,63,0.7);
    border: 1px solid #34d39988;
    color: #e8f0ea;
    font-size: 15px;
    padding: 12px 16px;
    border-radius: 12px;
    cursor: pointer;
    margin-top: 10px;
    transition: 0.15s;
  }
  .opt:hover { background: #a78bfa; border-color: #a78bfa; color: #0e3528; transform: translateX(4px); }
  .result-tag {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 999px;
    font-size: 13px;
    font-weight: bold;
    margin-bottom: 10px;
  }
  .rt-good { background: #34d39933; color: #34d399; border: 1px solid #34d39966; }
  .rt-bad  { background: #f8717133; color: #fca5a5; border: 1px solid #f8717166; }

  /* ===== 小游戏样式 ===== */
  .mg-stats { display: flex; justify-content: space-between; font-size: 13px; color: #9fb8ac; margin-bottom: 12px; }
  /* 翻牌 */
  .card-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .card {
    aspect-ratio: 3/4;
    background: linear-gradient(160deg, #14523f, #0e3528);
    border: 1px solid #34d39966;
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 30px;
    cursor: pointer;
    transition: transform 0.3s;
    user-select: none;
  }
  .card.flipped { background: #a78bfa22; border-color: #a78bfa; transform: rotateY(180deg) scale(1.03); }
  .card.matched { background: #34d39933; border-color: #34d399; cursor: default; opacity: 0.85; }
  /* 反应点击 */
  .react-area {
    position: relative;
    height: 320px;
    background: rgba(10,43,33,0.8);
    border: 1px solid #34d39944;
    border-radius: 12px;
    overflow: hidden;
    cursor: crosshair;
  }
  .target {
    position: absolute;
    width: 52px; height: 52px;
    border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    cursor: pointer;
    animation: popTarget 0.2s ease;
    user-select: none;
  }
  @keyframes popTarget { from { transform: scale(0); } to { transform: scale(1); } }

  /* ===== 开场 / 结算 ===== */
  .center { text-align: center; }
  .big-title { font-size: 32px; color: #c4b5fd; letter-spacing: 8px; text-shadow: 0 0 24px #7c3aed88; }
  .sub { font-size: 14px; color: #9fb8ac; line-height: 2; margin: 14px 0; }
  .team { font-size: 15px; color: #ffd97d; margin-bottom: 8px; }
  .final { font-size: 42px; color: #ffd97d; font-weight: bold; margin: 10px 0; }
  .btn-main {
    display: inline-block;
    background: linear-gradient(90deg, #7c3aed, #a78bfa);
    color: #fff;
    border: none;
    padding: 13px 40px;
    font-size: 17px;
    font-weight: bold;
    border-radius: 999px;
    cursor: pointer;
    margin-top: 14px;
    box-shadow: 0 6px 20px #7c3aed77;
    transition: 0.2s;
  }
  .btn-main:hover { transform: scale(1.05); }

  @media (max-width: 560px) {
    #dpad { display: flex; }
    .big-title { font-size: 24px; letter-spacing: 4px; }
    .card { font-size: 22px; }
  }
</style>
</head>
<body>

<div id="app">
  <!-- HUD 状态栏 -->
  <div id="hud">
    <div class="title">校园探索冒险</div>
    <div class="hp-wrap">
      <div class="hp-label">生命值 <span id="hpText">100</span> / 100</div>
      <div class="hp-track"><div class="hp-bar" id="hpBar"></div></div>
    </div>
    <div class="score-box">积分 <span id="scoreText">0</span></div>
    <div class="levels" id="levelText"></div>
  </div>

  <!-- 地图舞台 -->
  <div id="stage">
    <canvas id="map" width="800" height="520"></canvas>
    <button id="enterBtn" onclick="enterCurrentZone()">进入关卡</button>
  </div>

  <!-- 移动端方向键 -->
  <div id="dpad">
    <div class="pad">
      <div class="dkey up"    data-key="ArrowUp">▲</div>
      <div class="dkey left"  data-key="ArrowLeft">◀</div>
      <div class="dkey right" data-key="ArrowRight">▶</div>
      <div class="dkey down"  data-key="ArrowDown">▼</div>
    </div>
  </div>
</div>

<!-- 事件 / 提示弹窗 -->
<div class="overlay" id="modal">
  <div class="panel">
    <h2 id="modalTitle"></h2>
    <div class="desc" id="modalDesc"></div>
    <div id="modalChoices"></div>
  </div>
</div>

<!-- 小游戏弹窗 -->
<div class="overlay" id="mgOverlay">
  <div class="panel" id="mgPanel"></div>
</div>

<script>
/* =========================================================
 * 校园探索冒险 —— 单文件 2D 探索小游戏
 * 模块：状态管理 / 地图绘制 / 移动输入 / 随机事件 / 3 类小游戏
 * ========================================================= */

/* ---------------- 配置与数据 ---------------- */
const MAP_W = 800, MAP_H = 520;
const PLAYER_SPEED = 170;          // 移动速度 px/s
const PLAYER_R = 14;
const EVENT_MIN_GAP = 5, EVENT_MAX_GAP = 9; // 随机事件间隔（秒）

const TEAM_NAME = "月星行者队";

/* 四个建筑点位：rect 为碰撞区，door 为触发区中心 */
const buildings = [
  { key: "jxl",  name: "教学楼", emoji: "🏫", rect: [70, 55, 240, 145],  door: [190, 215], game: "quiz" },
  { key: "tsg",  name: "图书馆", emoji: "📚", rect: [510, 55, 240, 150], door: [630, 220], game: "memory" },
  { key: "st",   name: "食堂",   emoji: "🍜", rect: [70, 310, 240, 150], door: [190, 310], game: "react" },
  { key: "cch",  name: "操场",   emoji: "⚽", rect: [510, 300, 240, 170], door: [630, 300], game: "react2" }
];
const GAME_NAMES = { quiz: "文字答题闯关", memory: "记忆翻牌", react: "食堂反应点击", react2: "操场反应挑战" };

/* 随机事件库：choices 的 hp/score 为变化量 */
const randomEvents = [
  {
    title: "🎒 突发事件 · 捡到校园卡",
    desc: "走在林荫道上，你发现地上有一张校园卡。\n卡面写着：2024 级 · 人工智能学院。",
    choices: [
      { text: "交给辅导员，寻找失主", score: 15, hp: 0 },
      { text: "放到失物招领处", score: 10, hp: 0 },
      { text: "捡起来看看钱包里有多少钱", score: -10, hp: -10 }
    ]
  },
  {
    title: "🍜 突发事件 · 食堂偶遇",
    desc: "食堂二楼，你远远看到辅导员端着餐盘走来，\n而你想起了自己这周还没交的表格。",
    choices: [
      { text: "主动打招呼，顺便把表格交了", score: 15, hp: 5 },
      { text: "端着餐盘悄悄绕开", score: -5, hp: -5 },
      { text: "假装打电话，低头快走", score: 0, hp: 0 }
    ]
  },
  {
    title: "📝 突发事件 · 课堂小测验",
    desc: "路过高数教室，老师叫住你：\n\"来，说说这个极限怎么求？\"",
    choices: [
      { text: "认真思考，写出洛必达法则", score: 15, hp: -5 },
      { text: "诚实地承认：老师我不会", score: 5, hp: 0 },
      { text: "回答\"lim 就是蕾姆！\"", score: -10, hp: -10 }
    ]
  },
  {
    title: "🌧 突发事件 · 雨天赶路",
    desc: "突然下起大雨，你没带伞。\n教学楼还有 200 米，图书馆就在旁边。",
    choices: [
      { text: "淋雨狂奔，展现体育精神", score: 10, hp: -15 },
      { text: "在檐下等雨停，顺便背单词", score: 5, hp: 0 },
      { text: "向旁边同学拼伞，交个朋友", score: 12, hp: 0 }
    ]
  },
  {
    title: "🐱 突发事件 · 偶遇社猫",
    desc: "一只圆滚滚的橘猫挡在你面前，\n尾巴一甩，喵了一声。",
    choices: [
      { text: "蹲下来轻轻撸猫", score: 12, hp: 8 },
      { text: "掏出早餐的火腿肠分它一半", score: 15, hp: 5 },
      { text: "拍张照发朋友圈就走", score: 5, hp: 0 }
    ]
  },
  {
    title: "🛴 突发事件 · 共享单车",
    desc: "路边一辆共享单车倒在地上，\n眼看要被来往的人流踩踏。",
    choices: [
      { text: "扶起来摆正，报修坏锁", score: 12, hp: 0 },
      { text: "直接骑走，反正也是它先动的", score: -8, hp: 0 },
      { text: "绕开不管", score: 0, hp: 0 }
    ]
  }
];

/* 答题小游戏题库（答对 +12 分，答错 -10 HP） */
const quizBank = [
  { q: "图书馆借的书到期了，正确做法是？", opts: ["继续拖着不还", "线上续借或按时归还", "直接把书扔掉"], ans: 1 },
  { q: "早八快迟到了，最合适的做法是？", opts: ["翻墙溜进教室", "给老师报备并尽快赶到", "干脆不去了"], ans: 1 },
  { q: "食堂高峰期打饭，应该？", opts: ["排队有序等候", "让同学帮我插队", "直接挤到最前面"], ans: 0 },
  { q: "在图书馆安静区，你可以？", opts: ["大声打电话", "外放短视频", "戴耳机安静自习"], ans: 2 },
  { q: "校园里看到可疑的刷卡诈骗群，应该？", opts: ["拉室友进群赚钱", "不理会并向学校保卫处反映", "先投 100 试试水"], ans: 1 }
];

/* 翻牌小游戏图案（6 对） */
const memoryIcons = ["📚", "🎓", "🍜", "⚽", "🎤", "☕"];

/* ---------------- 游戏状态 ---------------- */
let state = null;

function newState() {
  return {
    running: false,
    paused: false,
    hp: 100,
    score: 0,
    px: 400, py: 260,          // 玩家位置
    facing: "down",
    done: {},                   // 已通关点位 { key: true }
    nearBuilding: null,         // 当前靠近的建筑
    eventTimer: 0,              // 距下次随机事件的秒数
    movingTime: 0
  };
}

/* DOM 引用 */
const $ = id => document.getElementById(id);
const el = {
  hpText: $("hpText"), hpBar: $("hpBar"), scoreText: $("scoreText"),
  levelText: $("levelText"), enterBtn: $("enterBtn"),
  modal: $("modal"), modalTitle: $("modalTitle"), modalDesc: $("modalDesc"),
  modalChoices: $("modalChoices"), mgOverlay: $("mgOverlay"), mgPanel: $("mgPanel")
};
const canvas = $("map");
const ctx = canvas.getContext("2d");

/* ---------------- 简易音效（Web Audio） ---------------- */
let audioCtx = null, soundOn = true;
function beep(freq, dur, delay = 0, type = "sine") {
  if (!soundOn) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    const o = audioCtx.createOscillator(), g = audioCtx.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(0.07, audioCtx.currentTime + delay);
    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + delay + dur);
    o.connect(g); g.connect(audioCtx.destination);
    o.start(audioCtx.currentTime + delay); o.stop(audioCtx.currentTime + delay + dur);
  } catch (e) {}
}
const sfx = {
  click: () => beep(600, 0.07),
  good:  () => { beep(523, 0.1); beep(784, 0.15, 0.09); },
  bad:   () => { beep(300, 0.15, 0, "square"); beep(210, 0.2, 0.1, "square"); },
  step:  () => beep(200, 0.03, 0, "triangle"),
  win:   () => [523, 659, 784, 1047].forEach((f, i) => beep(f, 0.18, i * 0.13)),
  lose:  () => [392, 330, 262, 196].forEach((f, i) => beep(f, 0.2, i * 0.15, "triangle"))
};

/* ---------------- HUD 更新 ---------------- */
function updateHUD() {
  el.hpText.textContent = state.hp;
  el.hpBar.style.width = Math.max(0, state.hp) + "%";
  el.hpBar.className = "hp-bar" + (state.hp <= 30 ? " low" : state.hp <= 60 ? " mid" : "");
  el.scoreText.textContent = state.score;
  el.levelText.textContent = buildings.map(b => state.done[b.key] ? "✔" : "○").join(" ");
}

/* 生命值 / 积分变化 + 浮动提示 */
function applyChange(scoreDelta, hpDelta) {
  if (scoreDelta) {
    state.score += scoreDelta;
    floatTip((scoreDelta > 0 ? "+" : "") + scoreDelta + " 积分", scoreDelta > 0 ? "#34d399" : "#f87171");
  }
  if (hpDelta) {
    state.hp += hpDelta;
    floatTip((hpDelta > 0 ? "+" : "") + hpDelta + " HP", hpDelta > 0 ? "#34d399" : "#f87171");
  }
  updateHUD();
  if (state.hp <= 0) endGame(false);
}
function floatTip(text, color) {
  const t = document.createElement("div");
  t.textContent = text;
  t.style.cssText = `position:fixed;left:50%;top:90px;transform:translateX(-50%);
    color:${color};font-weight:bold;font-size:20px;pointer-events:none;z-index:99;
    transition:all 1s ease;opacity:1;text-shadow:0 0 10px ${color}88`;
  document.body.appendChild(t);
  requestAnimationFrame(() => { t.style.top = "40px"; t.style.opacity = "0"; });
  setTimeout(() => t.remove(), 1000);
}

/* ---------------- 地图绘制 ---------------- */
function drawMap() {
  /* 背景 */
  ctx.fillStyle = "#0a2b21";
  ctx.fillRect(0, 0, MAP_W, MAP_H);

  /* 赛博网格 */
  ctx.strokeStyle = "rgba(124,58,237,0.10)";
  ctx.lineWidth = 1;
  for (let x = 0; x < MAP_W; x += 40) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, MAP_H); ctx.stroke(); }
  for (let y = 0; y < MAP_H; y += 40) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(MAP_W, y); ctx.stroke(); }

  /* 道路 */
  ctx.fillStyle = "rgba(232,240,234,0.10)";
  ctx.fillRect(330, 40, 60, 440);        // 纵向主路
  ctx.fillRect(40, 250, 720, 55);        // 横向主路
  ctx.strokeStyle = "rgba(167,139,250,0.25)";
  ctx.setLineDash([8, 8]);
  ctx.beginPath(); ctx.moveTo(360, 40); ctx.lineTo(360, 480); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(40, 277); ctx.lineTo(760, 277); ctx.stroke();
  ctx.setLineDash([]);

  /* 建筑与触发区 */
  buildings.forEach(b => {
    const [x, y, w, h] = b.rect;
    const done = state.done[b.key];
    /* 门口光圈 */
    ctx.beginPath();
    ctx.arc(b.door[0], b.door[1], 26, 0, Math.PI * 2);
    ctx.fillStyle = done ? "rgba(52,211,153,0.18)" : "rgba(167,139,250,0.18)";
    ctx.fill();
    ctx.strokeStyle = done ? "#34d39988" : "#a78bfa88";
    ctx.stroke();

    /* 建筑主体 */
    roundRect(x, y, w, h, 12);
    ctx.fillStyle = done ? "rgba(20,82,63,0.95)" : "rgba(36,21,67,0.92)";
    ctx.fill();
    ctx.strokeStyle = done ? "#34d399" : "#7c3aed";
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.lineWidth = 1;

    /* 标签 */
    ctx.fillStyle = done ? "#34d399" : "#c4b5fd";
    ctx.font = "bold 17px 'Microsoft YaHei'";
    ctx.textAlign = "center";
    ctx.fillText(b.emoji + " " + b.name + (done ? " ✔" : ""), x + w / 2, y + h / 2 + 6);
  });

  /* 树木点缀 */
  drawTree(320, 120); drawTree(480, 120); drawTree(320, 420); drawTree(480, 420);
  drawTree(400, 100); drawTree(400, 440);

  /* 玩家 */
  const p = state;
  ctx.save();
  ctx.shadowColor = "#a78bfa";
  ctx.shadowBlur = 16;
  ctx.beginPath();
  ctx.arc(p.px, p.py, PLAYER_R, 0, Math.PI * 2);
  ctx.fillStyle = "#a78bfa";
  ctx.fill();
  ctx.restore();
  ctx.fillStyle = "#fff";
  ctx.font = "bold 11px 'Microsoft YaHei'";
  ctx.textAlign = "center";
  ctx.fillText("我", p.px, p.py - 22);
}
function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}
function drawTree(x, y) {
  ctx.fillStyle = "rgba(52,211,153,0.35)";
  ctx.beginPath(); ctx.arc(x, y, 13, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(52,211,153,0.2)";
  ctx.beginPath(); ctx.arc(x + 8, y + 6, 9, 0, Math.PI * 2); ctx.fill();
}

/* ---------------- 移动与碰撞 ---------------- */
const keys = {};
window.addEventListener("keydown", e => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "e", "E"].includes(e.key)) e.preventDefault();
  keys[e.key] = true;
  if ((e.key === "e" || e.key === "E") && state && state.nearBuilding && !state.paused) enterCurrentZone();
});
window.addEventListener("keyup", e => { keys[e.key] = false; });

/* 移动端触屏方向键 */
document.querySelectorAll(".dkey").forEach(dk => {
  const k = dk.dataset.key;
  const on = e => { e.preventDefault(); keys[k] = true; dk.classList.add("on"); };
  const off = e => { e.preventDefault(); keys[k] = false; dk.classList.remove("on"); };
  dk.addEventListener("pointerdown", on);
  dk.addEventListener("pointerup", off);
  dk.addEventListener("pointerleave", off);
  dk.addEventListener("pointercancel", off);
});

function blocked(nx, ny) {
  /* 与建筑碰撞体相交则阻挡（含玩家半径） */
  return buildings.some(b => {
    const [x, y, w, h] = b.rect;
    return nx + PLAYER_R > x && nx - PLAYER_R < x + w && ny + PLAYER_R > y && ny - PLAYER_R < y + h;
  });
}

function updatePlayer(dt) {
  if (state.paused) return;
  let dx = 0, dy = 0;
  if (keys["w"] || keys["W"] || keys["ArrowUp"])    { dy -= 1; state.facing = "up"; }
  if (keys["s"] || keys["S"] || keys["ArrowDown"])  { dy += 1; state.facing = "down"; }
  if (keys["a"] || keys["A"] || keys["ArrowLeft"])  { dx -= 1; state.facing = "left"; }
  if (keys["d"] || keys["D"] || keys["ArrowRight"]) { dx += 1; state.facing = "right"; }
  if (!dx && !dy) return;

  const len = Math.hypot(dx, dy);
  const step = PLAYER_SPEED * dt;
  const nx = state.px + dx / len * step;
  const ny = state.py + dy / len * step;

  /* 分轴移动：贴墙滑行 */
  if (!blocked(nx, state.py)) state.px = nx;
  if (!blocked(state.px, ny)) state.py = ny;
  state.px = Math.max(PLAYER_R, Math.min(MAP_W - PLAYER_R, state.px));
  state.py = Math.max(PLAYER_R, Math.min(MAP_H - PLAYER_R, state.py));

  state.movingTime += dt;
  /* 随机事件计时 */
  state.eventTimer -= dt;
  if (state.eventTimer <= 0) { triggerRandomEvent(); resetEventTimer(); }
}

function resetEventTimer() {
  state.eventTimer = EVENT_MIN_GAP + Math.random() * (EVENT_MAX_GAP - EVENT_MIN_GAP);
}

/* 靠近建筑检测 */
function checkNearBuilding() {
  state.nearBuilding = buildings.find(b => {
    const [x, y, w, h] = b.rect;
    const cx = Math.max(x, Math.min(state.px, x + w));
    const cy = Math.max(y, Math.min(state.py, y + h));
    return Math.hypot(state.px - cx, state.py - cy) < 46;
  }) || null;
  if (state.nearBuilding && !state.paused) {
    const b = state.nearBuilding;
    el.enterBtn.textContent = state.done[b.key] ? b.name + " · 已通关，可再次挑战" : "进入" + b.name + " · " + GAME_NAMES[b.game];
    el.enterBtn.style.display = "block";
  } else {
    el.enterBtn.style.display = "none";
  }
}

/* ---------------- 通用弹窗 ---------------- */
function showModal(title, desc, choices, onDone) {
  state.paused = true;
  el.modalTitle.textContent = title;
  el.modalDesc.textContent = desc;
  el.modalChoices.innerHTML = "";
  choices.forEach(c => {
    const btn = document.createElement("button");
    btn.className = "opt";
    btn.textContent = c.text;
    btn.onclick = () => {
      sfx.click();
      closeModal();
      onDone && onDone(c);
    };
    el.modalChoices.appendChild(btn);
  });
  el.modal.classList.add("show");
}
function closeModal() {
  el.modal.classList.remove("show");
  state.paused = false;
}

/* ---------------- 随机事件 ---------------- */
function triggerRandomEvent() {
  const ev = randomEvents[Math.floor(Math.random() * randomEvents.length)];
  showModal(ev.title, ev.desc, ev.choices, c => {
    applyChange(c.score, c.hp);
    (c.score > 0 || c.hp > 0) ? sfx.good() : (c.score < 0 || c.hp < 0) ? sfx.bad() : sfx.click();
    if (state.hp <= 0) return;
  });
}

/* ---------------- 小游戏框架 ---------------- */
function openMinigame(key, buildingKey) {
  state.paused = true;
  el.mgOverlay.classList.add("show");
  if (key === "quiz") startQuiz(buildingKey);
  else if (key === "memory") startMemory(buildingKey);
  else startReaction(buildingKey, key === "react2");
}

function closeMinigame() {
  el.mgOverlay.classList.remove("show");
  el.mgPanel.innerHTML = "";
  state.paused = false;
}

/* 小游戏结算：passed 是否通关 */
function finishMinigame(buildingKey, passed, scoreDelta, hpDelta, summaryHtml) {
  const b = buildings.find(x => x.key === buildingKey);
  if (passed) state.done[buildingKey] = true;
  applyChange(scoreDelta, hpDelta);
  if (state.hp <= 0) { closeMinigame(); return; }

  passed ? sfx.win() : sfx.bad();
  const title = passed ? "🎉 关卡通关！" : "💪 挑战失败";
  const allDone = buildings.every(x => state.done[x.key]);
  el.mgPanel.innerHTML =
    '<h2 class="center">' + title + '</h2>' +
    '<p class="desc center">' + (summaryHtml || "") + '</p>' +
    '<div class="center"><button class="btn-main" id="mgNext">' +
    (allDone ? "查看结算" : "返回校园") + '</button></div>';
  $("mgNext").onclick = () => {
    closeMinigame();
    if (allDone) endGame(true);
  };
}

/* ===== 小游戏 1：文字答题 ===== */
function startQuiz(buildingKey) {
  const questions = [...quizBank].sort(() => Math.random() - 0.5).slice(0, 5);
  let idx = 0, correct = 0;

  function renderQ() {
    const q = questions[idx];
    el.mgPanel.innerHTML =
      '<h2>📝 文字答题闯关</h2>' +
      '<div class="mg-stats"><span>教学楼关卡</span><span>第 ' + (idx + 1) + ' / ' + questions.length + ' 题 · 答对 ' + correct + ' 题</span></div>' +
      '<p class="desc">' + q.q + '</p>' +
      '<div id="quizOpts"></div>';
    const box = $("quizOpts");
    q.opts.forEach((t, i) => {
      const btn = document.createElement("button");
      btn.className = "opt";
      btn.textContent = String.fromCharCode(65 + i) + " . " + t;
      btn.onclick = () => {
        if (i === q.ans) { correct++; sfx.good(); applyChange(12, 0); }
        else { sfx.bad(); applyChange(0, -10); }
        if (state.hp <= 0) { closeMinigame(); return; }
        idx++;
        if (idx < questions.length) renderQ();
        else {
          const passed = correct >= 3;
          finishMinigame(buildingKey, passed, 0, 0,
            "答对 <b style='color:#ffd97d'>" + correct + "</b> / " + questions.length + " 题<br>" +
            (passed ? "校园常识满分！" : "答对 3 题才能通关，去校园里再积累积累吧～"));
        }
      };
      box.appendChild(btn);
    });
  }
  renderQ();
}

/* ===== 小游戏 2：记忆翻牌 ===== */
function startMemory(buildingKey) {
  const cards = [...memoryIcons, ...memoryIcons].sort(() => Math.random() - 0.5);
  let first = null, lock = false, moves = 0, matched = 0;
  const totalPairs = memoryIcons.length;

  el.mgPanel.innerHTML =
    '<h2>🃏 记忆翻牌</h2>' +
    '<div class="mg-stats"><span>图书馆关卡</span><span>步数 <b id="mgMoves">0</b> · 配对 <b id="mgMatch">0</b>/' + totalPairs + '</span></div>' +
    '<div class="card-grid" id="cardGrid"></div>' +
    '<p class="sub">翻开两张相同图案即可配对，步数越少得分越高！</p>';
  const grid = $("cardGrid");

  cards.forEach((icon, i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.textContent = "?";
    card.dataset.icon = icon;
    card.onclick = () => flip(card);
    grid.appendChild(card);
  });

  function flip(card) {
    if (lock || card.classList.contains("flipped") || card.classList.contains("matched")) return;
    sfx.click();
    card.classList.add("flipped");
    card.textContent = card.dataset.icon;

    if (!first) { first = card; return; }
    moves++; $("mgMoves").textContent = moves;
    if (first.dataset.icon === card.dataset.icon) {
      /* 配对成功 */
      first.classList.add("matched");
      card.classList.add("matched");
      first = null;
      matched++;
      $("mgMatch").textContent = matched;
      sfx.good();
      if (matched === totalPairs) {
        /* 得分：步数越少越高，最低 15 最高 40 */
        const gained = Math.max(15, 40 - (moves - totalPairs) * 3);
        const bonusHp = moves <= 9 ? 10 : 0;
        finishMinigame(buildingKey, true, gained, bonusHp,
          "用 <b style='color:#ffd97d'>" + moves + "</b> 步完成全部配对<br>获得积分 +" + gained +
          (bonusHp ? "，思维敏捷 HP +10" : ""));
      }
    } else {
      /* 配对失败：短暂展示后盖回 */
      lock = true;
      applyChange(0, 0);
      setTimeout(() => {
        card.classList.remove("flipped"); card.textContent = "?";
        first.classList.remove("flipped"); first.textContent = "?";
        first = null; lock = false;
      }, 650);
    }
  }
}

/* ===== 小游戏 3/4：反应点击 ===== */
function startReaction(buildingKey, hardMode) {
  const TOTAL = 12, LIFE = hardMode ? 950 : 1250;
  let spawned = 0, hits = 0, expired = 0, playing = true, curTarget = null;
  const theme = hardMode ? "操场反应挑战 · 奔跑的光点" : "食堂反应点击 · 抢餐盘";

  el.mgPanel.innerHTML =
    '<h2>⚡ ' + (hardMode ? "操场反应挑战" : "食堂反应点击") + '</h2>' +
    '<div class="mg-stats"><span>' + theme + '</span><span>目标 <b id="rgHits">0</b>/' + TOTAL + ' · 剩余 <b id="rgLeft">' + TOTAL + '</b></span></div>' +
    '<div class="react-area" id="reactArea"></div>' +
    '<p class="sub">' + (hardMode ? "光点存在 0.95 秒，手速拉满！" : "餐盘存在 1.25 秒，点击得分！") + '</p>';
  const area = $("reactArea");

  function spawn() {
    if (!playing || spawned >= TOTAL) return;
    spawned++;
    $("rgLeft").textContent = TOTAL - spawned;
    const t = document.createElement("div");
    t.className = "target";
    t.textContent = hardMode ? "🏃" : "🍚";
    t.style.background = hardMode
      ? "radial-gradient(circle, #fbbf24, #f59e0b)"
      : "radial-gradient(circle, #34d399, #10b981)";
    t.style.boxShadow = "0 0 18px " + (hardMode ? "#fbbf2488" : "#34d39988");
    const size = 52;
    t.style.left = Math.random() * (area.clientWidth - size - 8) + 4 + "px";
    t.style.top = Math.random() * (area.clientHeight - size - 8) + 4 + "px";
    area.appendChild(t);
    curTarget = t;
    const kill = setTimeout(() => {
      if (t.parentNode) { t.remove(); expired++; missHit(); }
    }, LIFE);
    t.onclick = e => {
      e.stopPropagation();
      clearTimeout(kill);
      t.remove();
      hits++; $("rgHits").textContent = hits;
      sfx.good();
      applyChange(5, 0);
      curTarget = null;
      nextSpawn();
    };
  }
  function missHit() {
    sfx.bad();
    applyChange(0, -6);
    if (state.hp <= 0) { playing = false; closeMinigame(); return; }
    curTarget = null;
    nextSpawn();
  }
  /* 点到空白区域也算失误 */
  area.onclick = () => {
    if (curTarget && curTarget.parentNode) {
      curTarget.remove();
      expired++;
      missHit();
    }
  };
  function nextSpawn() {
    if (spawned >= TOTAL) {
      playing = false;
      setTimeout(() => {
        const passed = hits >= 8;
        finishMinigame(buildingKey, passed, 0, 0,
          "命中 <b style='color:#ffd97d'>" + hits + "</b> / " + TOTAL + "<br>" +
          (passed ? "反应力惊人！" : "命中 8 次才能通关，再来一次！"));
      }, 300);
      return;
    }
    setTimeout(spawn, 350 + Math.random() * 450);
  }
  spawn();
}

/* ---------------- 进入关卡入口 ---------------- */
function enterCurrentZone() {
  const b = state.nearBuilding;
  if (!b || state.paused || !state.running) return;
  sfx.click();
  if (state.done[b.key]) {
    /* 已通关：二次确认可重玩刷分 */
    showModal("🔁 " + b.name, "该关卡已通关。\n再次挑战可刷新体验，但请注意生命值！", [
      { text: "再次挑战", retry: true },
      { text: "返回探索", retry: false }
    ], c => { if (c.retry) openMinigame(b.game, b.key); });
  } else {
    openMinigame(b.game, b.key);
  }
}

/* ---------------- 主循环 ---------------- */
let lastTime = 0;
function loop(ts) {
  if (!state || !state.running) return;
  const dt = Math.min(0.05, (ts - lastTime) / 1000 || 0);
  lastTime = ts;
  updatePlayer(dt);
  checkNearBuilding();
  drawMap();
  requestAnimationFrame(loop);
}

/* ---------------- 开场 / 结算 ---------------- */
function showTitle() {
  state = newState();
  updateHUD();
  drawMap();
  el.modalTitle.textContent = "校园探索冒险";
  el.modalDesc.innerHTML =
    '<div class="center">' +
    '<div class="big-title">校园探索冒险</div>' +
    '<div class="team">参赛队伍：' + TEAM_NAME + '</div>' +
    '<div class="sub">🎮 WASD / 方向键 移动（手机用屏幕方向键）<br>' +
    '⚡ 移动时会随机触发校园事件，选择影响积分与生命值<br>' +
    '🏫 走到教学楼 / 图书馆 / 食堂 / 操场 门口，按 <b style="color:#c4b5fd">E</b> 或点按钮进入关卡<br>' +
    '🏆 通关全部 4 个关卡即胜利，生命值归零则失败</div>' +
    '</div>';
  el.modalChoices.innerHTML = "";
  const btn = document.createElement("button");
  btn.className = "btn-main";
  btn.textContent = "▶ 开始游戏";
  btn.onclick = () => { sfx.click(); closeModal(); state.running = true; resetEventTimer(); lastTime = performance.now(); requestAnimationFrame(loop); };
  el.modalChoices.appendChild(btn);
  el.modal.classList.add("show");
}

function endGame(victory) {
  state.running = false;
  victory ? sfx.win() : sfx.lose();
  let rank;
  if (state.score >= 120) rank = "🏆 校园传奇";
  else if (state.score >= 80) rank = "🌟 探索达人";
  else if (state.score >= 40) rank = "🌱 小有收获";
  else rank = "🚶 平凡的一天";
  el.modalTitle.textContent = victory ? "🏆 胜利结算" : "💀 游戏失败";
  el.modalDesc.innerHTML =
    '<div class="center">' +
    '<div class="final">' + state.score + '</div>' +
    '<div style="color:#9fb8ac;font-size:14px">最终积分</div>' +
    '<div style="font-size:20px;color:#34d399;margin-top:12px">' + rank + '</div>' +
    '<div class="sub">' +
    (victory ? "四个关卡全部通关！你在校园的一天精彩纷呈。" : "生命值耗尽……休息一下，重新出发！") +
    '</div></div>';
  el.modalChoices.innerHTML = "";
  const btn = document.createElement("button");
  btn.className = "btn-main";
  btn.textContent = "🔄 重新开始";
  btn.onclick = () => { sfx.click(); closeModal(); showTitle(); };
  el.modalChoices.appendChild(btn);
  el.modal.classList.add("show");
}

/* ---------------- 启动 ---------------- */
showTitle();
</script>
